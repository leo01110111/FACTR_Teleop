# RealSense camera configuration
# Loaded by cameras/realsense.py. Override the file per-camera with:
#   ros2 run cameras realsense --ros-args -p config_file:=realsense.yaml
#
# FOV / intrinsics below were measured from the physical device at 640x480
# (see `initialize_cameras`). They are informational for downstream consumers;
# changing resolution changes the effective FOV, so update them if you do.

# Device model: Intel RealSense D455
device:
  serial: "220422301536"     # camera serial number (rs-enumerate-devices / query_devices)
  name: "realsense"          # used in published topic names: /realsense/<name>/im, /depth

stream:
  width: 640
  height: 480
  fps: 30

# Measured intrinsics @ 640x480 (color and depth streams are aligned to color).
color:
  hfov_deg: 79.68
  vfov_deg: 64.13
  fx: 383.52
  fy: 383.09
  ppx: 320.68
  ppy: 241.95

depth:
  hfov_deg: 78.92
  vfov_deg: 63.38
  fx: 388.73
  fy: 388.73
  ppx: 320.89
  ppy: 241.30
  depth_scale: 0.001          # meters per raw depth unit
